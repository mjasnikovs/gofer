[[permission]]
identifier = "main-window-commands"
description = "Allows the main window to use Gofer's user-facing application commands."
commands.allow = [
    "activate_chat_task",
    "apply_script_rename",
    "call_godot",
    "call_godot_debug",
    "call_script_language",
    "cancel_ai_request",
    "cancel_godot",
    "close_script_document",
    "create_chat_task",
    "create_project_backup",
    "delete_rag_cache",
    "delete_workspace_path",
    "edit_workspace_file",
    "format_gdscript",
    "get_godot_session",
    "get_rag_cache_status",
    "import_legacy_chat",
    "initialize_rag",
    "launch_godot",
    "list_ai_models",
    "list_project_tasks",
    "list_workspace_files",
    "load_chat",
    "load_settings",
    "merge_task_worktree",
    "move_workspace_path",
    "open_script_document",
    "query_godot_docs",
    "read_chat_attachment",
    "read_godot_logs",
    "read_workspace_file",
    "respond_tool_approval",
    "run_storage_maintenance",
    "save_chat",
    "save_chat_attachment",
    "save_script_document",
    "save_settings",
    "send_ai_message",
    "send_godot_command",
    "start_godot_session",
    "stop_godot_session",
    "subscribe_godot_events",
    "subscribe_script_diagnostics",
    "test_ai_connection",
    "unsubscribe_godot_events",
    "unsubscribe_script_diagnostics",
    "unwatch_workspace_files",
    "update_script_document",
    "watch_workspace_files",
    "write_workspace_file",
]
