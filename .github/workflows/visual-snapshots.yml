name: Visual snapshots

on:
    workflow_dispatch:

jobs:
    snapshots:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: npm
            - name: Install JavaScript dependencies
              run: npm ci
            - name: Install pinned visual-test browser
              run: npx playwright install --with-deps chromium
            - name: Regenerate the snapshots
              run: npm run --silent test:visual:update
            - name: Publish the regenerated snapshots
              uses: actions/upload-artifact@v4
              with:
                  name: visual-snapshots
                  path: e2e/visual/**/*-snapshots/*.png
                  if-no-files-found: error
                  retention-days: 14
