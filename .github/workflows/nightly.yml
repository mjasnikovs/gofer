name: Nightly desktop journey

on:
    schedule:
        - cron: '23 2 * * *'
    workflow_dispatch:

concurrency:
    group: nightly-desktop
    cancel-in-progress: false

jobs:
    desktop:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-2025, macos-15]
        uses: ./.github/workflows/packaged-journey.yml
        with:
            os: ${{ matrix.os }}
            godot-suite: true
