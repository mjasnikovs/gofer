name: Check

on:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: check-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: npm
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.97.1
                  components: clippy,rustfmt
            - name: Reuse the compiled dependency tree between runs
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Install system dependencies
              run: >-
                  sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
                  libappindicator3-dev librsvg2-dev patchelf unzip xvfb mold
            - name: Install JavaScript dependencies
              run: npm ci
            - name: Install pinned visual-test browser
              run: npx playwright install --with-deps chromium
            - name: Install pinned WebDriver browser
              id: chrome
              uses: browser-actions/setup-chrome@v2
              with:
                  chrome-version: 150.0.7871.124
                  install-chromedriver: true
            - name: Install pinned Godot
              env:
                  GOFER_GODOT_INSTALL_DIR: ${{ runner.temp }}/godot
              run: node scripts/install-godot.mjs
            - name: Build the pinned gdformat sidecar
              run: npm run build:gdformat
            - name: Run required checks with zero retries
              env:
                  GOFER_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
                  GOFER_CHROMEDRIVER_BINARY: ${{ steps.chrome.outputs.chromedriver-path }}
              run: npm run check
            - name: Run the visual and accessibility suite
              run: npm run --silent test:visual
            - name: Collect the visual differences
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-differences
                  path: test-results/
                  if-no-files-found: ignore
                  retention-days: 14

    packaged:
        uses: ./.github/workflows/packaged-journey.yml
        with:
            os: ubuntu-24.04

    rust-coverage:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: npm
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: nightly-2026-07-25
                  components: llvm-tools-preview
            - name: Reuse the compiled dependency tree between runs
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
                  key: llvm-cov
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-llvm-cov
            - name: Install Linux Tauri dependencies
              run: >-
                  sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
                  libappindicator3-dev librsvg2-dev patchelf unzip xvfb mold
            - name: Install JavaScript dependencies
              run: npm ci
            - name: Install pinned Godot
              env:
                  GOFER_GODOT_INSTALL_DIR: ${{ runner.temp }}/godot
              run: node scripts/install-godot.mjs
            - name: Enforce Rust line and branch coverage
              run: npm run test:coverage:rust
